
name: A股收盘数据更新

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: signal-lab-data-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 更新数据
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python update_data.py
      - name: 记录冻结规则的前瞻观察
        continue-on-error: true
        run: python forward_log.py --data data.js
      - name: 记录冻结科创50脉冲纸上观察
        continue-on-error: true
        run: python research/altseason_forward.py --data data.js
      - name: 记录冻结创业板脉冲纸上观察
        continue-on-error: true
        run: python research/cy_altseason_forward.py --data data.js
      - name: 保存并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js research/forward
          if [ -d research/forward-altseason-kc ]; then git add research/forward-altseason-kc; fi
          if [ -d research/forward-altseason-cy ]; then git add research/forward-altseason-cy; fi
          git diff --staged --quiet || (git commit -m "auto: update A-share close data" && git push)


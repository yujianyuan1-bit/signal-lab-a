name: 猪皮信号2.0独立研究扫描

on:
  workflow_dispatch:
  schedule:
    # 工作日北京时间18:40执行（GitHub计划任务可能延迟，节假日运行时拒绝采集）
    - cron: '40 10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: zhupi-scan-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装研究依赖
        run: python -m pip install -r requirements_scan.txt
      - name: 引擎测试（失败拒绝发布）
        run: python -m unittest discover -s tests -p 'test_scan.py' -v
      - name: 盘后采集与研究扫描
        run: python zhupi_scan.py --spot --industries --data-dir research/scan2/archive --pit-dir research/scan2/pit_daily --output scan_data.json
      - name: 仅提交独立研究数据（允许行业源暂不可用）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scan_data.json
          if [ -d research/scan2/archive ]; then git add -- research/scan2/archive; fi
          if [ -d research/scan2/pit_daily ]; then git add -- research/scan2/pit_daily; fi
          if ! git diff --staged --quiet; then
            git commit -m "research: update Zhupi 2.0 close-only scan"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: SignalLab 原版六标的 R1-R2 雷达

on:
  workflow_dispatch:
  schedule:
    # Shanghai 18:05 on weekdays; collector verifies the exchange calendar.
    - cron: '5 10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: signal-lab-multi-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 恢复原版雷达独立代码与历史缓存
        run: |
          if [ ! -f research/scanner/scanner.py ]; then
            python -m zipfile -e r1r2_restore_bundle.zip .
          fi
      - name: 安装交易日历
        run: python -m pip install exchange-calendars
      - name: 原冻结规则与采集边界测试
        run: python -m unittest discover -s tests/scanner -v
      - name: 通达信官方日线与东财备用源扫描
        id: scanner
        continue-on-error: true
        run: python research/scanner/collect.py
      - name: 保存原版雷达代码、来源与扫描结果
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/scanner tests/scanner
          if ! git diff --cached --quiet; then
            git commit -m 'research(scanner): restore original six-asset R1/R2 radar'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: 采集失败时明确报错
        if: steps.scanner.outcome != 'success'
        run: exit 1
